[package]
name = "ludometer-engine"
version = "0.1.0"
edition = "2021"
description = "Azul rules, PUCT tree and self-play arena for ludometer (the net stays in PyTorch)"
license = "MIT"

[lib]
name = "ludometer_rs"
crate-type = ["cdylib", "rlib"]

[features]
default = []
python = ["pyo3", "numpy"]

[dependencies]
pyo3 = { version = "0.29", features = ["extension-module", "abi3-py312"], optional = true }
numpy = { version = "0.29", optional = true }

[dev-dependencies]
