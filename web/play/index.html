<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Azul: play the Ludometer agents</title>
<!-- one cobalt tile, inline: the page must never ask the network for anything -->
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='4' fill='%2317509e'/%3E%3Crect x='9' y='9' width='14' height='14' rx='2' fill='%234a80c8'/%3E%3C%2Fsvg%3E">
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="topbar">
  <div class="brand">
    <span class="brand-name">Azul</span>
    <span class="brand-sub" id="matchup">a tile game for two</span>
  </div>

  <form class="setup" id="setup" autocomplete="off">
    <label class="field">
      <span class="field-label">Opponent</span>
      <select id="opponent">
        <option value="best">Strongest trained (auto)</option>
        <option value="heuristic">Heuristic</option>
        <option value="greedy">Greedy</option>
        <option value="random">Random</option>
        <option value="custom">Trained checkpoint…</option>
      </select>
      <span class="field-note" id="opponent-note"></span>
    </label>
    <label class="field field-narrow hidden" id="think-field">
      <span class="field-label">AI thinks for</span>
      <select id="think">
        <option value="0">Instant reply</option>
        <option value="3">3 seconds</option>
        <option value="5" selected>5 seconds</option>
        <option value="10">10 seconds</option>
      </select>
    </label>
    <label class="field field-wide hidden" id="spec-field">
      <span class="field-label">Agent spec</span>
      <input type="text" id="spec" spellcheck="false"
             placeholder="mcts:runs/&lt;run&gt;/checkpoints/&lt;name&gt;.pt?sims=400">
    </label>
    <label class="field field-narrow">
      <span class="field-label">Seed</span>
      <input type="text" id="seed" inputmode="numeric" placeholder="random">
    </label>
    <label class="check">
      <input type="checkbox" id="first" checked>
      <span>You go first</span>
    </label>
    <button type="submit" class="btn btn-primary" id="deal">Deal tiles</button>
  </form>
</header>

<main class="table">

  <!-- one glance = whole game state; nothing on this page ever covers the board -->
  <section id="status"></section>

  <!-- the panel opens inline and pushes the table down; this page has no pop-ups -->
  <section id="settings" aria-label="Settings"></section>

  <section class="panel">
    <h2 class="panel-title">The middle of the table</h2>
    <div id="middle"></div>
    <div class="middle-actions">
      <span class="brand-sub" id="prompt">Deal the tiles to begin.</span>
      <!-- move navigation: pure replay of positions the page already has -->
      <div id="nav" aria-label="Move navigation"></div>
      <button type="button" class="btn" id="hint">Suggest a move</button>
      <button type="button" class="btn hidden" id="cancel">Clear selection</button>
    </div>
  </section>

  <div class="boards">
    <section id="board-human" aria-label="Your board"></section>
    <section id="board-ai" aria-label="The AI's board"></section>
  </div>

  <section id="scoring" hidden aria-live="polite"></section>

  <div class="below">
    <section class="panel">
      <div class="board-head">
        <h2 class="panel-title" id="log-title">Move log</h2>
        <label class="check coach off" id="coach-field" title="Score your moves with the AI's own search">
          <input type="checkbox" id="coach">
          <span>Coach mode</span>
        </label>
      </div>
      <p class="coach-legend" id="coach-legend" hidden></p>
      <ol class="log" id="log" aria-labelledby="log-title"></ol>
    </section>

    <section class="panel">
      <h2 class="panel-title">Supply</h2>
      <div class="supply-rows" id="supply"></div>
    </section>
  </div>

</main>

<div class="fly-layer" id="fly" aria-hidden="true"></div>
<div class="toasts" id="toasts" aria-live="assertive"></div>

<script type="module" src="app.js"></script>
</body>
</html>
