[project]
name = "ludometer"
version = "0.1.0"
description = "Measuring board game quality via RL learning curves (Azul calibration)"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.0",
    "torch>=2.4",
    "flask>=3.0",
]

[dependency-groups]
dev = ["pytest>=8.0", "ruff>=0.6"]

[project.scripts]
ludometer-gui = "ludometer.gui.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ludometer"]

[tool.pytest.ini_options]
testpaths = ["tests"]
